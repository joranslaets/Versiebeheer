<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackjack Royale</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="table">
    <header>
      <h1>Blackjack Royale</h1>
      <p class="subtitle">Luxe casinotafel met live dealer</p>
      <div class="bank-row">
        <div>Bank: <span id="bankAmount">€1000</span></div>
        <div>Inzet: <span id="betAmount">€100</span></div>
      </div>
      <div class="bet-chips" id="betChips">
        <button class="chip" data-value="10">10</button>
        <button class="chip" data-value="25">25</button>
        <button class="chip" data-value="50">50</button>
        <button class="chip active" data-value="100">100</button>
        <button class="chip" data-value="200">200</button>
      </div>
      <div class="hint">Kies je inzet en begin het spel.</div>
    </header>

    <div class="board">
      <section class="hand dealer-panel">
        <div class="panel-top">
          <h2>DEALER</h2>
          <span class="dealer-badge">BANKER</span>
        </div>
        <div class="cards" id="dealerCards"></div>
        <div class="status" id="dealerStatus"></div>
      </section>

      <div class="center-action">
        <button id="startButton" class="start-btn">START SPEL</button>
      </div>

      <section class="hand player-panel">
        <div class="panel-top">
          <h2>JOUW HAND</h2>
          <span class="player-badge">VIP</span>
        </div>
        <div id="playerHands"></div>
      </section>
    </div>

    <div class="controls">
      <button id="hitButton">HIT</button>
      <button id="standButton">STAND</button>
      <button id="doubleButton">DOUBLE</button>
      <button id="splitButton">SPLIT</button>
      <button id="newGameButton">NIEUW SPEL</button>
    </div>

    <div class="message" id="message"></div>
    <div class="track-note">Klik op de pagina om muziek te starten.</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
